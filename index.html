<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D4VG1EXLS6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D4VG1EXLS6');
  </script>
  <title>BonkGraph</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <img src="assets/whif_logo.jpg" alt="whif" class="logo">
      <div class="brand-txt">
        <span class="brand-name">BonkGraph</span>
        <span class="brand-by">by Bonkku</span>
      </div>
    </div>

    <input id="graph-title" class="graph-title" type="text" placeholder="Character's Flag" aria-label="ชื่อกราฟ">

    <div class="actions">
      <select id="tpl-select" title="Choose template">
        <option value="flag">Character Flags</option>
        <option value="mbti">MBTI</option>
        <option value="blank">Custom (Blank)</option>
      </select>
      <button id="btn-template" title="Edit template">⚙️ Edit Graph</button>
      <button id="btn-import-json" title="Import JSON">📥</button>
      <button id="btn-export-json" title="Save JSON">💾</button>
      <button id="btn-export-png" class="primary" title="Save as PNG">🖼️ PNG</button>
      <button id="btn-reset" title="Clear board">🧹</button>
    </div>
  </header>

  <!-- panel แก้ไข template (ซ่อนไว้) -->
  <section id="tpl-panel" class="tpl-panel">
    <div id="tpl-fields"></div>
  </section>

  <main id="stage">
    <div id="board" aria-label="Graph board"></div>
  </main>

  <section id="tray-wrap">
    <div class="tray-head">
      <span class="tray-title">Characters (<span id="tray-count">0</span>)</span>
      <span class="tray-hint">Drag onto the board • drag out to return</span>
      <span class="tray-tools">
        <button id="btn-add-char" title="Add character (upload image or paste JSON)">➕ Add Character</button>
        <button id="btn-clear-chars" title="Remove all added characters">🗑️</button>
      </span>
    </div>
    <div id="tray"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
