<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>BonkGraph</title>
  <link rel="icon" href="assets/whif_logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <img src="assets/whif_logo.jpg" alt="whif" class="logo">
      <div class="brand-txt">
        <span class="brand-name">BonkGraph</span>
        <span class="brand-by">by Bonkku</span>
      </div>
    </div>

    <input id="graph-title" class="graph-title" type="text" placeholder="Character's Flag" aria-label="ชื่อกราฟ">

    <div class="actions">
      <select id="tpl-select" title="เลือก template">
        <option value="flag">ธงตัวละคร</option>
        <option value="mbti">MBTI</option>
        <option value="blank">Custom (ว่าง)</option>
      </select>
      <button id="btn-template" title="แก้ไข template">⚙️ แก้กราฟ</button>
      <button id="btn-import-json" title="นำเข้า JSON">📥</button>
      <button id="btn-export-json" title="บันทึก JSON">💾</button>
      <button id="btn-export-png" class="primary" title="บันทึกเป็นรูป PNG">🖼️ PNG</button>
      <button id="btn-reset" title="ล้างกระดาน">🧹</button>
    </div>
  </header>

  <!-- panel แก้ไข template (ซ่อนไว้) -->
  <section id="tpl-panel" class="tpl-panel">
    <div id="tpl-fields"></div>
  </section>

  <main id="stage">
    <div id="board" aria-label="กระดานกราฟ"></div>
  </main>

  <section id="tray-wrap">
    <div class="tray-head">
      <span>ตัวละครในถาด (<span id="tray-count">0</span>)</span>
      <span class="tray-hint">ลากขึ้นกระดาน • ลากออกนอกกระดานเพื่อเก็บคืน</span>
    </div>
    <div id="tray"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
