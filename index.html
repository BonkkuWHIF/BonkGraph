<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D4VG1EXLS6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D4VG1EXLS6');
  </script>
  <title>BonkGraph</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div id="lang-dd" class="lang-dd">
      <button id="lang-btn" class="lang-btn" type="button" data-i18n-title="tipLang" title="Language" aria-label="Language"></button>
      <div id="lang-menu" class="lang-menu" hidden></div>
    </div>
    <select id="tpl-select" data-i18n-title="tipTemplate" title="Choose template">
      <option value="flag">Character Flags</option>
      <option value="mbti">MBTI</option>
      <option value="mbti16">MBTI · 16 Types</option>
      <option value="blank">Custom (Blank)</option>
    </select>
    <button id="btn-template" data-i18n="editGraph" data-i18n-title="tipEditTpl" title="Edit template">⚙️ Edit Graph</button>
    <span class="topbar-spacer"></span>
    <button id="btn-import-json" data-i18n-title="tipImport" title="Import JSON">📥</button>
    <button id="btn-export-json" data-i18n-title="tipSaveJson" title="Save JSON">💾</button>
    <button id="btn-export-png" class="primary" data-i18n-title="tipSavePng" title="Save as PNG">🖼️ PNG</button>
    <button id="btn-reset" data-i18n-title="tipClearBoard" title="Clear board">🧹</button>
  </header>

  <!-- panel แก้ไข template + การแสดงผล (ซ่อนไว้) -->
  <section id="tpl-panel" class="tpl-panel">
    <div id="display-fields" class="display-fields">
      <label><span data-i18n="titleColor">Title color</span><input id="ctl-title-color" type="color"></label>
      <label><span data-i18n="titleSize">Title size</span><input id="ctl-title-size" type="range" min="2" max="7" step="0.2"></label>
      <label><span data-i18n="badgeSize">Badge size</span><input id="ctl-badge-size" type="range" min="0.5" max="2" step="0.1"></label>
    </div>
    <div id="tpl-fields"></div>
  </section>

  <main id="stage">
    <div class="frame-brand">
      <img class="frame-logo" src="assets/ark_logo.png" alt="Ark">
      <span class="frame-brand-txt">Create at <a href="https://bonkkuwhif.github.io/BonkGraph/" target="_blank" rel="noopener">bonkkuwhif.github.io/BonkGraph</a></span>
    </div>
    <input id="graph-title" class="frame-title" type="text" placeholder="Character's Flag" aria-label="Graph title">
    <div class="board-wrap">
      <div id="board" aria-label="Graph board"></div>
    </div>
    <input id="frame-url" class="frame-url" type="text" value="https://www.whif.io/" spellcheck="false" aria-label="URL">
  </main>

  <section id="tray-wrap">
    <div class="tray-head">
      <span class="tray-title"><span data-i18n="charactersLabel">Characters</span> (<span id="tray-count">0</span>)</span>
      <span class="tray-hint" data-i18n="dragHint">Drag onto the board • drag out to return</span>
      <span class="tray-tools">
        <button id="btn-add-char" data-i18n="addCharacter" data-i18n-title="tipAddChar" title="Add character (upload image or paste JSON)">➕ Add Character</button>
        <button id="btn-clear-chars" data-i18n-title="tipRemoveChars" title="Remove all added characters">🗑️</button>
      </span>
    </div>
    <div id="tray"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
